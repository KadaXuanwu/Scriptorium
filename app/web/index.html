<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>Scriptorium</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The icons, drawn once: <svg class="i"><use href="#i-name"/></svg> shows one. It has no size of its own: not every
     browser hides an svg for the `hidden` attribute, and it then takes 150 px at the top. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-workers" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></symbol>
  <symbol id="i-questions" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-accounts" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M23 4v6h-6M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-steps" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
  <symbol id="i-config" viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h1M11 12h9M4 18h7M17 18h3"/><circle cx="16" cy="6" r="2.5"/><circle cx="8" cy="12" r="2.5"/><circle cx="14" cy="18" r="2.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
</svg>
<div id="app">
  <!-- One tab per view: a rail on a wide screen, a bar in thumb reach on a phone. -->
  <nav id="tabs">
    <!-- The mark has no background: the page takes the one whose ink shows on its theme (style.css, the same condition). -->
    <div class="brand"><picture><source srcset="mark-on-dark.png" media="(prefers-color-scheme: dark)"><img src="mark-on-light.png" alt="" width="32" height="32"></picture><strong>Scriptorium</strong></div>
    <a href="#workers" data-tab="workers"><svg class="i"><use href="#i-workers"/></svg><span>Workers</span><span class="count hot" id="count-workers"></span></a>
    <a href="#accounts" data-tab="accounts"><svg class="i"><use href="#i-accounts"/></svg><span>Accounts</span><span class="count hot" id="count-accounts"></span></a>
    <a href="#questions" data-tab="questions"><svg class="i"><use href="#i-questions"/></svg><span>Questions</span><span class="count" id="count-questions"></span></a>
    <a href="#queue" data-tab="queue"><svg class="i"><use href="#i-queue"/></svg><span>Queue</span><span class="count" id="count-queue"></span></a>
    <a href="#history" data-tab="history"><svg class="i"><use href="#i-history"/></svg><span>History</span></a>
    <a href="#details" data-tab="details"><svg class="i"><use href="#i-info"/></svg><span>Details</span></a>
    <span id="stamp"></span>
  </nav>
  <main>
    <div id="offline" hidden></div>
    <!-- A project that the page cannot load now (app.js, setNotice). -->
    <div id="notice" hidden></div>

    <section class="view" id="workers">
      <header><h1>Workers</h1><div class="buttons" id="all-buttons"></div><div id="workers-projects" class="projects"></div></header>
      <div class="pane"><div id="worker-list" class="grid"></div></div>
    </section>

    <section class="view" id="questions" hidden>
      <header><h1>Questions</h1><div id="away" class="buttons"></div><div id="questions-projects" class="projects"></div></header>
      <div class="split">
        <div class="pane"><h2 class="hot" id="blocking-title">Blocking</h2><div id="blocking-list"></div></div>
        <div class="pane"><h2 id="open-title">Not blocking</h2><div id="open-list"></div></div>
      </div>
    </section>

    <section class="view" id="queue" hidden>
      <header><h1>Queue</h1><div class="stats" id="queue-stats"></div><div id="queue-projects" class="projects"></div></header>
      <div class="split wide">
        <div class="pane"><div id="stuck-list"></div><h2>Up next</h2><div id="queue-list" class="list"></div></div>
        <div class="pane"><div id="held-list"></div><h2 id="parked-title">Parked</h2><div id="parked-list" class="list"></div></div>
      </div>
    </section>

    <section class="view" id="accounts" hidden>
      <header><h1>Accounts</h1><div id="accounts-projects" class="projects"></div></header>
      <div class="pane">
        <div id="login-box"></div>
        <div id="account-list" class="grid"></div>
      </div>
    </section>

    <section class="view" id="history" hidden>
      <header><h1>History</h1><div id="history-projects" class="projects"></div></header>
      <div class="split">
        <div class="pane"><h2>Merged</h2><div id="merged-list" class="list"></div></div>
        <div class="pane"><h2>Runs</h2><div id="run-list" class="list"></div></div>
      </div>
    </section>

    <!-- The settings that are the same for all workers of a project (app.js, settingsBlock), then the info text. -->
    <section class="view" id="details" hidden>
      <header><h1>Details</h1><div id="details-projects" class="projects"></div></header>
      <div class="pane"><div id="settings-body"></div><div id="info-body" class="info"></div></div>
    </section>
  </main>
</div>
<dialog id="steps">
  <div class="dialog-head"><h2 id="steps-title">Steps</h2><button data-close>Close</button></div>
  <ol id="steps-list" class="steps"></ol>
</dialog>
<!-- A worker's config (app.js, drawConfig): the complexities it takes. -->
<dialog id="config">
  <div class="dialog-head"><h2 id="config-title"></h2><button data-close>Close</button></div>
  <div id="config-body"></div>
</dialog>
<!-- How a worker's run ends when the owner pauses or disables it. -->
<dialog id="how">
  <div class="dialog-head"><h2 id="how-title"></h2><button data-close>Cancel</button></div>
  <div id="how-options" class="options"></div>
</dialog>
<!-- A question's pictures at full size, one at a time (app.js, Viewer). -->
<dialog id="viewer">
  <div class="dialog-head"><h2 id="viewer-count"></h2><a id="viewer-open" target="_blank">Open in a tab</a><button data-close>Close</button></div>
  <img id="viewer-img" alt="">
  <div class="viewer-foot"><button class="round" data-view="-1" aria-label="Previous picture">&lsaquo;</button><div id="viewer-text" class="text"></div><button class="round" data-view="1" aria-label="Next picture">&rsaquo;</button></div>
</dialog>
<!-- A question before an action: the page's own dialog, never the browser's, the same for every action (app.js, ask).
     Adding something puts its fields in it. -->
<dialog id="ask">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <p id="ask-text"></p>
    <div id="ask-fields" class="form"></div>
    <div class="buttons"><button value="yes" class="primary" id="ask-yes"></button><button value="" id="ask-no" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<div id="pull" aria-hidden="true"><svg class="i"><use href="#i-retry"/></svg></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
